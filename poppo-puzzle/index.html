<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3da542">
<title>ぽっぽちゃん がったいパズル</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef5e6;
    --ink: #24352a;
    --ink-soft: #5d6f62;
    --green: #3da542;
    --green-dark: #2b7d30;
    --sheet: #fffdf5;
    --staff: #dfe8d6;
    --danger: #e0533d;
    --card: #ffffff;
    --shadow: 0 4px 14px rgba(36, 53, 42, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 520px;
    margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
    gap: 6px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand { font-weight: 800; line-height: 1.1; font-size: 15px; color: var(--green-dark); flex: 1; min-width: 0; }
  .brand small { display: block; font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .stat {
    background: var(--card);
    border-radius: 12px;
    padding: 4px 10px;
    box-shadow: var(--shadow);
    text-align: center;
    min-width: 64px;
  }
  .stat span { display: block; font-size: 10px; color: var(--ink-soft); font-weight: 700; }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat.next { padding: 3px 6px; min-width: 0; }
  #nextCv { display: block; width: 40px; height: 40px; }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    color: var(--ink);
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 8px 12px;
    min-height: 40px;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  #soundBtn { font-size: 13px; white-space: nowrap; }
  #soundBtn[aria-pressed="false"] { color: var(--ink-soft); }
  .toolbar { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .seg { display: flex; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
  .seg button { box-shadow: none; min-height: 34px; padding: 4px 12px; font-size: 13px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
  .best { flex: 1; text-align: right; color: var(--ink-soft); font-weight: 700; }
  .best b { color: var(--ink); font-variant-numeric: tabular-nums; }
  #restartBtn { font-size: 13px; min-height: 36px; padding: 4px 12px; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cv { display: block; touch-action: none; border-radius: 18px; box-shadow: var(--shadow); }
  #ladder {
    display: flex;
    justify-content: center;
    gap: 3px;
    padding: 2px 0;
  }
  #ladder i {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-style: normal;
    font-size: 10px;
    font-weight: 800;
    color: var(--ink);
    opacity: .28;
    transition: opacity .3s, transform .3s;
  }
  #ladder i.got { opacity: 1; }
  #ladder i.last { background: #e6f4dc !important; overflow: hidden; }
  #ladder i.last img { width: 125%; height: auto; margin-top: 6px; }

  /* オーバーレイ（タイトル・終了画面） */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(36, 53, 42, .55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .panel {
    background: var(--sheet);
    border-radius: 22px;
    width: 100%;
    max-width: 420px;
    margin: auto 0;
    padding: 22px 18px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  }
  .panel h1, .panel h2 { margin: 0 0 6px; color: var(--green-dark); }
  .panel h1 { font-size: 24px; }
  .panel h2 { font-size: 26px; }
  .panel p { margin: 6px 0; line-height: 1.6; }
  .hero { width: 120px; height: auto; display: block; margin: 4px auto 8px; }
  .howto { font-size: 14px; color: var(--ink-soft); text-align: left; background: #fff; border-radius: 14px; padding: 10px 14px; }
  .howto li { margin: 3px 0; }
  .choices { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .choices button { min-width: 130px; font-size: 16px; padding: 12px 16px; }
  .primary { background: var(--green); color: #fff; }
  .final-score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .newbest { color: var(--danger); font-weight: 800; }
  .info {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    margin-top: 14px;
    text-align: left;
  }
  .info h3 { margin: 0 0 6px; font-size: 16px; color: var(--green-dark); }
  .info .row { display: flex; gap: 12px; align-items: flex-start; }
  .info img { width: 72px; height: auto; flex: none; }
  .info p { font-size: 14px; margin: 4px 0; white-space: pre-line; }
  .info a.btn[hidden] { display: none; }
  .info a.btn {
    display: inline-block;
    margin-top: 8px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    border-radius: 999px;
    padding: 8px 16px;
  }
  .noscript { padding: 24px; text-align: center; }
</style>
<!-- 物理エンジン Matter.js（バージョン固定）。cdnjs が読めないときは jsDelivr から読む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<noscript><div class="noscript">このゲームは JavaScript を有効にすると遊べます。</div></noscript>
<div id="app">
  <header>
    <div class="brand">ぽっぽちゃん<small>がったいパズル</small></div>
    <div class="stat"><span>スコア</span><b id="score">0</b></div>
    <div class="stat next"><span>つぎ</span><canvas id="nextCv" width="80" height="80"></canvas></div>
    <button id="soundBtn" type="button" aria-pressed="true">♪ 音 オン</button>
  </header>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="むずかしさ">
      <button type="button" data-diff="easy" aria-pressed="true">やさしい</button>
      <button type="button" data-diff="normal" aria-pressed="false">ふつう</button>
    </div>
    <span class="best">ベスト <b id="best">0</b></span>
    <button id="restartBtn" type="button">やりなおす</button>
  </div>
  <main id="stage"><canvas id="cv" aria-label="ゲーム画面"></canvas></main>
  <div id="ladder" aria-label="合体のじゅんばん"></div>
</div>

    '<p class="noscript">物理エンジン（Matter.js）を読み込めませんでした。<br>インターネットにつながっているか確かめて、もういちど開いてください。</p>';

const { Engine, Bodies, Body, Composite, Events } = Matter;
const LAST = STAGES.length - 1;

const $ = (id) => document.getElementById(id);
const cv = $('cv');
const ctx = cv.getContext('2d');
const nextCv = $('nextCv');
const nctx = nextCv.getContext('2d');

// 絵の読み込み
const imgs = {};
for (const [key, src] of Object.entries(IMAGES)) {
  const im = new Image();
  im.src = src;
  imgs[key] = im;
}

// 保存（使えない環境でも動くように try/catch）
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 保存できなくても遊べる */ } },
};

/* ---------- 音（ブラウザで作る仮の音） ---------- */
const Sound = {
  ctx: null,
  master: null,
  enabled: store.get('poppo.sound', true),
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      // iOS 向け：無音を一度鳴らして有効にする
      const buf = this.ctx.createBuffer(1, 1, 22050);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start(0);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  ready() { return this.enabled && this.ctx && this.ctx.state === 'running'; },
  tone(hz, { dur = 0.45, type = 'triangle', vol = 0.35, delay = 0 } = {}) {
    if (!this.ready()) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(hz, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },
  merge(stageIndex) {
    const n = NOTES[STAGES[stageIndex].note];
    if (!n) return;
    this.tone(n.hz, { dur: 0.5, type: 'triangle', vol: 0.35 });
    this.tone(n.hz * 2, { dur: 0.3, type: 'sine', vol: 0.08 });
  },
  drop() { this.tone(196, { dur: 0.12, type: 'sine', vol: 0.15 }); },
  clear() {
    STAGES.forEach((s, i) => {
      const n = NOTES[s.note];
      if (n) this.tone(n.hz, { dur: 0.5, vol: 0.22, delay: i * 0.08 });
    });
    this.tone(NOTES.C6.hz, { dur: 1.2, vol: 0.3, delay: STAGES.length * 0.08 });
    this.tone(NOTES.E5.hz, { dur: 1.2, vol: 0.2, delay: STAGES.length * 0.08 });
    this.tone(NOTES.G5.hz, { dur: 1.2, vol: 0.2, delay: STAGES.length * 0.08 });
  },
  over() {
    [392, 329.63, 261.63].forEach((hz, i) => this.tone(hz, { dur: 0.4, vol: 0.25, delay: i * 0.18 }));
  },
};

// 最初のタップ（クリック・キー）で音を有効にする
['pointerdown', 'touchend', 'keydown'].forEach((ev) =>
  window.addEventListener(ev, () => Sound.unlock(), { passive: true })
);

const soundBtn = $('soundBtn');
function renderSoundBtn() {
  soundBtn.setAttribute('aria-pressed', String(Sound.enabled));
  soundBtn.textContent = Sound.enabled ? '♪ 音 オン' : '♪ 音 オフ';
}
soundBtn.addEventListener('click', () => {
  Sound.enabled = !Sound.enabled;
  store.set('poppo.sound', Sound.enabled);
  renderSoundBtn();
  if (Sound.enabled) { Sound.unlock(); Sound.tone(NOTES.C5.hz, { dur: 0.2, vol: 0.2 }); }
});
renderSoundBtn();

/* ---------- ゲームの状態 ---------- */
let diffKey = store.get('poppo.diff', 'easy');
if (!DIFFICULTY[diffKey]) diffKey = 'easy';
let engine, pieces, mergeQueue;
let state = 'title';          // title / playing / over / clear
let score = 0;
let current = 0, next = 0;    // 手に持っている楽器・つぎの楽器（段階の番号）
let holdX = FIELD.width / 2;
let simTime = 0, canDropAt = 0, overSince = null;
let clearedOnce = false;
let reached = 0;              // いちばん上まで行った段階
let effects = [];

const randomStage = () => Math.floor(Math.random() * DIFFICULTY[diffKey].dropMaxStage);
const bestKey = () => 'poppo.best.' + diffKey;

function makeWalls() {
  const { width: W, height: H, wall } = FIELD;
  const t = 200;
  const opt = { isStatic: true, friction: 0.2, restitution: 0.1 };
  return [
    Bodies.rectangle(wall - t / 2, H / 2 - H, t, H * 3, opt),        // 左
    Bodies.rectangle(W - wall + t / 2, H / 2 - H, t, H * 3, opt),    // 右
    Bodies.rectangle(W / 2, H - wall + t / 2, W + t * 2, t, opt),    // 下
  ];
}

function createPiece(i, x, y) {
  const s = STAGES[i];
  const b = Bodies.circle(x, y, s.radius, {
    friction: s.friction,
    frictionStatic: 0.4,
    restitution: s.restitution,
    frictionAir: 0.008,
  });
  b.stageIndex = i;
  b.bornAt = simTime;
  b.popAt = performance.now();
  b.merged = false;
  return b;
}

function newGame() {
  engine = Engine.create();
  engine.gravity.y = DIFFICULTY[diffKey].gravity;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  Composite.add(engine.world, makeWalls());
  pieces = new Set();
  mergeQueue = [];
  const queuePairs = (e) => {
    for (const p of e.pairs) {
      const a = p.bodyA, b = p.bodyB;
      if (a.stageIndex !== undefined && a.stageIndex === b.stageIndex) mergeQueue.push([a, b]);
    }
  };
  Events.on(engine, 'collisionStart', queuePairs);
  Events.on(engine, 'collisionActive', queuePairs);

  score = 0;
  simTime = 0;
  canDropAt = 0;
  overSince = null;
  clearedOnce = false;
  reached = 0;
  effects = [];
  current = randomStage();
  next = randomStage();
  holdX = FIELD.width / 2;
  state = 'playing';
  updateHud();
  renderLadder();
  $('titleOv').hidden = true;
  $('endOv').hidden = true;
}

function clampX(x, i) {
  const r = STAGES[i].radius;
  return Math.max(FIELD.wall + r + 1, Math.min(FIELD.width - FIELD.wall - r - 1, x));
}

function drop() {
  if (state !== 'playing' || simTime < canDropAt) return;
  const b = createPiece(current, clampX(holdX, current), FIELD.dropY);
  Composite.add(engine.world, b);
  pieces.add(b);
  Sound.drop();
  current = next;
  next = randomStage();
  canDropAt = simTime + FIELD.dropCooldownMs;
  drawNext();
}

function processMerges() {
  if (!mergeQueue.length) return;
  const queue = mergeQueue;
  mergeQueue = [];
  for (const [a, b] of queue) {
    if (a.merged || b.merged) continue;
    a.merged = b.merged = true;
    Composite.remove(engine.world, [a, b]);
    pieces.delete(a);
    pieces.delete(b);
    const i = a.stageIndex;
    const x = (a.position.x + b.position.x) / 2;
    const y = (a.position.y + b.position.y) / 2;

    if (i < LAST) {
      // 次の段階を2つの中間に出す
      const ni = i + 1;
      const nb = createPiece(ni, clampX(x, ni), y);
      nb.bornAt = simTime - FIELD.graceMs; // 合体でできたものは猶予なし
      Body.setVelocity(nb, {
        x: (a.velocity.x + b.velocity.x) / 4,
        y: (a.velocity.y + b.velocity.y) / 4,
      });
      Composite.add(engine.world, nb);
      pieces.add(nb);
      score += STAGES[ni].score;
      reached = Math.max(reached, ni);
      Sound.merge(ni);
      addMergeEffect(x, y, ni);
      if (ni === LAST && !clearedOnce) {
        clearedOnce = true;
        Sound.clear();
        const eng = engine;
        setTimeout(() => { if (engine === eng) showEnd('clear'); }, 700);
      }
    } else {
      // ぽっぽちゃんどうし：ふたりとも飛んでいって大きなボーナス
      score += STAGES[LAST].score * 2;
      Sound.clear();
      addMergeEffect(x, y, LAST, true);
    }
  }
  updateHud();
  renderLadder();
}

function checkOver() {
  let over = false;
  for (const b of pieces) {
    if (simTime - b.bornAt < FIELD.graceMs) continue;
    if (b.position.y - b.circleRadius < FIELD.topLine) { over = true; break; }
  }
  if (!over) { overSince = null; return; }
  if (overSince === null) overSince = simTime;
  if (simTime - overSince >= DIFFICULTY[diffKey].overLimitMs) showEnd('over');
}

/* ---------- 画面表示 ---------- */
function updateHud() {
  $('score').textContent = score;
  const best = Math.max(store.get(bestKey(), 0), score);
  $('best').textContent = best;
  drawNext();
}

function renderLadder() {
  const el = $('ladder');
  if (!el.children.length) {
    STAGES.forEach((s, i) => {
      const d = document.createElement('i');
      d.title = s.name;
      d.style.background = s.color;
      d.textContent = NOTES[s.note] ? NOTES[s.note].kana : '';
      if (s.image) {
        d.classList.add('last');
        d.textContent = '';
        const im = document.createElement('img');
        im.src = IMAGES[s.image];
        im.alt = '';
        d.appendChild(im);
      }
      el.appendChild(d);
    });
  }
  [...el.children].forEach((d, i) => d.classList.toggle('got', i <= Math.max(reached, DIFFICULTY[diffKey].dropMaxStage - 1)));
}

function showEnd(kind) {
  if (state !== 'playing') return;
  state = kind;
  const prevBest = store.get(bestKey(), 0);
  const isNewBest = score > prevBest;
  if (isNewBest) store.set(bestKey(), score);
  if (kind === 'over') Sound.over();

  $('endTitle').textContent = kind === 'clear' ? 'クリア！' : 'おしまい';
  $('endLead').textContent = kind === 'clear'
    ? 'ぽっぽちゃんに会えたね！'
    : 'こんどは ぽっぽちゃんに会えるかな？';
  $('endScore').textContent = score;
  const bestEl = $('endBest');
  bestEl.textContent = isNewBest ? 'ベスト こうしん！' : `ベスト ${Math.max(prevBest, score)}`;
  bestEl.className = isNewBest ? 'newbest' : '';
  $('continueBtn').hidden = kind !== 'clear';
  $('endOv').hidden = false;
  $('endOv').scrollTop = 0;
  updateHud();
}

function fillContent() {
  $('poppoName').textContent = CONTENT.poppo.name;
  $('poppoText').textContent = CONTENT.poppo.text;
  $('schoolName').textContent = CONTENT.school.name;
  $('schoolText').textContent = CONTENT.school.text;
  $('schoolAddress').textContent = CONTENT.school.address;
  const link = $('schoolLink');
  if (CONTENT.school.url) {
    link.href = CONTENT.school.url;
    link.textContent = CONTENT.school.linkLabel;
    link.hidden = false;
  }
}

function addMergeEffect(x, y, i, big = false) {
  const now = performance.now();
  const s = STAGES[i];
  effects.push({ kind: 'ring', x, y, r: s.radius, color: s.color, t0: now, life: big ? 900 : 450 });
  const kana = NOTES[s.note] ? NOTES[s.note].kana : '';
  const count = big || i === LAST ? 10 : 2;
  for (let k = 0; k < count; k++) {
    effects.push({
      kind: 'note', x: x + (Math.random() - 0.5) * s.radius, y,
      vx: (Math.random() - 0.5) * 0.06, text: k === 0 ? '♪' + kana : '♪',
      color: k % 2 ? '#2b7d30' : '#e0533d', t0: now, life: 1100,
    });
  }
}

// 画面サイズに合わせる
let scale = 1;
function resize() {
  const main = $('stage');
  const w = main.clientWidth, h = main.clientHeight;
  scale = Math.max(0.3, Math.min(w / FIELD.width, h / FIELD.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = FIELD.width * scale + 'px';
  cv.style.height = FIELD.height * scale + 'px';
  cv.width = Math.round(FIELD.width * scale * dpr);
  cv.height = Math.round(FIELD.height * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));

function drawPiece(c, i, x, y, alpha = 1, k = 1) {
  const s = STAGES[i];
  const r = s.radius * k;
  c.save();
  c.globalAlpha = alpha;
  c.translate(x, y);
  const im = s.image && imgs[s.image];
  c.beginPath();
  c.arc(0, 0, r, 0, Math.PI * 2);
  if (im && im.complete && im.naturalWidth) {
    c.fillStyle = '#f2fbe9';
    c.fill();
    c.save();
    c.clip();
    // 円に収まるように絵を置く
    const ar = im.naturalWidth / im.naturalHeight;
    const h = r * 1.9, w = h * ar;
    c.drawImage(im, -w / 2, -h / 2 + r * 0.04, w, h);
    c.restore();
    c.lineWidth = 3;
    c.strokeStyle = s.color;
    c.stroke();
  } else {
    c.fillStyle = s.color;
    c.fill();
    c.lineWidth = 2;
    c.strokeStyle = 'rgba(36,53,42,.22)';
    c.stroke();
    // つや
    c.beginPath();
    c.ellipse(-r * 0.35, -r * 0.42, r * 0.32, r * 0.18, -0.5, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,255,255,.45)';
    c.fill();
    // 楽器名
    const lines = (s.label || s.name).split('\n');
    const maxLen = Math.max(...lines.map((l) => l.length));
    const size = Math.min(r * 0.5, (r * 1.62) / maxLen, (r * 1.3) / lines.length);
    c.fillStyle = '#24352a';
    c.font = `800 ${size}px "Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Meiryo",sans-serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    lines.forEach((l, n) => c.fillText(l, 0, (n - (lines.length - 1) / 2) * size * 1.1));
  }
  c.restore();
}

function drawNext() {
  const size = nextCv.width;
  nctx.clearRect(0, 0, size, size);
  if (state === 'title') return;
  const r = STAGES[next].radius;
  const k = (size / 2 - 3) / r;
  nctx.save();
  nctx.scale(k, k);
  drawPiece(nctx, next, size / 2 / k, size / 2 / k);
  nctx.restore();
}

function draw() {
  const { width: W, height: H, wall, topLine } = FIELD;
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);

  // 楽譜のような背景
  ctx.fillStyle = '#fffdf5';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#dfe8d6';
  ctx.lineWidth = 1;
  for (let top = topLine + 50; top + 48 < H; top += 110) {
    for (let n = 0; n < 5; n++) {
      ctx.beginPath();
      ctx.moveTo(wall, top + n * 12);
      ctx.lineTo(W - wall, top + n * 12);
      ctx.stroke();
    }
  }
  // かべ
  ctx.fillStyle = '#9fcf8a';
  ctx.fillRect(0, 0, wall, H);
  ctx.fillRect(W - wall, 0, wall, H);
  ctx.fillRect(0, H - wall, W, wall);

  // 上端の線（こえているときは赤く点滅）
  const warn = overSince !== null && state === 'playing';
  ctx.save();
  ctx.setLineDash([8, 6]);
  ctx.lineWidth = warn ? 3 : 2;
  ctx.strokeStyle = warn && Math.floor(now / 200) % 2 ? '#e0533d' : 'rgba(224,83,61,.45)';
  ctx.beginPath();
  ctx.moveTo(wall, topLine);
  ctx.lineTo(W - wall, topLine);
  ctx.stroke();
  ctx.restore();

  // 手に持っている楽器と落ちる位置のガイド
  if (state === 'playing') {
    const x = clampX(holdX, current);
    const ready = simTime >= canDropAt;
    ctx.save();
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(43,125,48,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, FIELD.dropY + STAGES[current].radius);
    ctx.lineTo(x, H - wall);
    ctx.stroke();
    ctx.restore();
    drawPiece(ctx, current, x, FIELD.dropY, ready ? 1 : 0.4);
  }

  // 楽器
  if (pieces) {
    for (const b of pieces) {
      const age = now - b.popAt;
      const k = age < 160 ? 0.7 + 0.3 * (age / 160) : 1;
      drawPiece(ctx, b.stageIndex, b.position.x, b.position.y, 1, k);
    }
  }

  // 合体のエフェクト
  effects = effects.filter((e) => now - e.t0 < e.life);
  for (const e of effects) {
    const p = (now - e.t0) / e.life;
    ctx.save();
    ctx.globalAlpha = 1 - p;
    if (e.kind === 'ring') {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (1 + p * 0.6), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = e.color;
      ctx.font = '800 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.text, e.x + e.vx * (now - e.t0), e.y - p * 70);
    }
    ctx.restore();
  }
}

/* ---------- ループ ---------- */
const STEP = 1000 / 60;
let last = 0, acc = 0;
function frame(t) {
  const dt = last ? Math.min(t - last, 100) : 0;
  last = t;
  if (state === 'playing') {
    acc += dt;
    while (acc >= STEP && state === 'playing') {
      Engine.update(engine, STEP);
      simTime += STEP;
      processMerges();
      acc -= STEP;
    }
    if (state === 'playing') checkOver();
  } else {
    acc = 0;
  }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 操作 ---------- */
function toFieldX(clientX) {
  const rect = cv.getBoundingClientRect();
  return ((clientX - rect.left) / rect.width) * FIELD.width;
}
let pressing = false;
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'playing') return;
  pressing = true;
  holdX = toFieldX(e.clientX);
  try { cv.setPointerCapture(e.pointerId); } catch { /* なくても動く */ }
  e.preventDefault();
});
cv.addEventListener('pointermove', (e) => {
  if (state !== 'playing') return;
  if (pressing || e.pointerType === 'mouse') holdX = toFieldX(e.clientX);
});
const release = (e) => {
  if (!pressing) return;
  pressing = false;
  holdX = toFieldX(e.clientX);
  drop();
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { pressing = false; });
window.addEventListener('keydown', (e) => {
  if (state !== 'playing') return;
  if (e.key === 'ArrowLeft') { holdX = clampX(holdX, current) - 12; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { holdX = clampX(holdX, current) + 12; e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') { drop(); e.preventDefault(); }
});
// スマホで画面がスクロール・ズームしないように
document.addEventListener('touchmove', (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());

function setDiff(key) {
  diffKey = key;
  store.set('poppo.diff', key);
  document.querySelectorAll('.seg button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.diff === key)));
}
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.diff === diffKey) return;
  if (state === 'playing' && score > 0 && !confirm('むずかしさを かえて、あたらしく はじめますか？')) return;
  setDiff(b.dataset.diff);
  if (state !== 'title') newGame();
  else updateHud();
}));
document.querySelectorAll('[data-start]').forEach((b) => b.addEventListener('click', () => {
  Sound.unlock();
  setDiff(b.dataset.start);
  newGame();
}));
$('restartBtn').addEventListener('click', () => {
  if (state === 'title') return;
  if (state === 'playing' && score > 0 && !confirm('はじめから やりなおしますか？')) return;
  newGame();
});
$('againBtn').addEventListener('click', newGame);
$('continueBtn').addEventListener('click', () => {
  $('endOv').hidden = true;
  state = 'playing';
  overSince = null;
});

/* ---------- はじまり ---------- */
setDiff(diffKey);
fillContent();
updateHud();
renderLadder();
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
